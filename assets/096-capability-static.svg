<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Original illustrated containment study of SCP-096"><style>.specimen{transform-origin:240px 240px;animation:activity 5s ease-in-out infinite}@keyframes activity{0%,100%{transform:translateY(0)}50%{transform:translateY(4px) rotate(1deg)}}@media(prefers-reduced-motion:reduce){.specimen{animation:none}}</style><defs><radialGradient id="room"><stop stop-color="#626b58"/><stop offset="1" stop-color="#192822"/></radialGradient><filter id="grain"><feTurbulence baseFrequency=".7" numOctaves="3" seed="96"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0h4" stroke="#060f0c" opacity=".2"/></pattern></defs><style>.label{font:11px monospace;fill:#c3c5a1;letter-spacing:1px}.trace{fill:none;stroke:#bbc3a1;stroke-width:2;stroke-dasharray:8 6;animation:flow 3s linear infinite}.signal{animation:signal 4s steps(2,end) infinite}.pulse-rings{animation:halo 4s ease-in-out infinite;transform-origin:240px 220px}.float-particles{animation:float 4s ease-in-out infinite}.fall{animation:fall 2s ease-in infinite}.leak{animation:halo 3s ease-in-out infinite}.growth{stroke-dasharray:500;stroke-dashoffset:500;animation:grow 6s ease-in-out infinite}.regrow{transform-origin:203px 233px;animation:regrow 5s ease-in-out infinite}.erasure{animation:erase 5s steps(2,end) infinite}.scanner{animation:scan 5s linear infinite}.approach{transform-origin:110px 210px;animation:approach 6s steps(3,end) infinite}.aisle{transform-origin:240px 230px;animation:approach 6s linear infinite}.blink-shutter{opacity:0;animation:blink 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes signal{0%,70%,100%{opacity:.15}30%,60%{opacity:.9}}@keyframes halo{0%,100%{opacity:.15}50%{opacity:.9}}@keyframes float{0%,100%